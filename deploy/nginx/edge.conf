# Privacy-safe access log (PDPA). The default "combined"/"main" format logs $request, which carries
# the query string (GET /api/applications/status?q=<national ID | phone | CC25 code>, the e-mail link
# /status?q=CC25-...) and the application code in the path (/api/applications/CC25-XXXXXX/slip), a
# credential for the code-keyed endpoints. cc25_private logs only the method and the decoded path
# ($uri, never $args/$request/$request_uri), with the segment after /applications/ masked unless it is
# a fixed route word. $http_referer is left out on purpose: it can carry the same query strings.
map $uri $cc25_log_uri {
    "~*^(?<cc25_pre>.*/applications/)(?!(?:status|public|export-audit)(?:/|$))[^/]+(?<cc25_post>.*)$" "${cc25_pre}CC25-******${cc25_post}";
    default $uri;
}

log_format cc25_private escape=default '$remote_addr - [$time_local] "$request_method $cc25_log_uri" $status $body_bytes_sent $request_time "$http_user_agent"';

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 10m;

    # Overrides the http-level access_log of the image's nginx.conf (see cc25_private above).
    access_log /var/log/nginx/access.log cc25_private;

    # คำเตือน: หากเซิร์ฟเวอร์ภาควิชามี Reverse Proxy ชั้นหน้า (เช่น Host Nginx / Traefik / NPM / Cloudflare Tunnel)
    # แต่ปล่อย set_real_ip_from เป็นคอมเมนต์ไว้ ทุกคำขอจะใช้ IP ของ Proxy ทำให้ Go RateLimiter (8 req/min/IP)
    # นับผู้สมัครทุกคนเป็น IP เดียวกัน!
    # ให้คลายคอมเมนต์เฉพาะ CIDR ของ Proxy ชั้นหน้าที่เชื่อถือได้จริง (อย่าเปิดวงกว้างเกินจำเป็นหากไม่ได้อยู่หลัง Proxy นั้น)
    # พร้อมเปิด real_ip_header และ real_ip_recursive on; เพื่อแกะ IP จริงจาก X-Forwarded-For แบบหลายชั้นอย่างถูกต้อง:
    # set_real_ip_from 127.0.0.1/32;
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 192.168.0.0/16;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Resolve backend/frontend at request time through Docker's embedded DNS instead of once at
    # startup. `up -d --build` recreates those containers with new IPs but leaves this one running;
    # with a literal `proxy_pass http://backend:8000` nginx kept the old IPs and answered 502 on
    # every page until edge-proxy was restarted (outage 2026-11-24, after deploy 9c20ad9).
    # proxy_pass with a variable and no URI still forwards the request URI exactly as received.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cc25_backend http://backend:8000;
    set $cc25_frontend http://frontend:4321;

    # ปิดกั้น Swagger และ OpenAPI Docs ที่ระดับ Edge Proxy (Defense-in-Depth คู่กับ ENABLE_SWAGGER=false)
    location ~ ^/(swagger|docs|api/swagger|api/docs)(/|$) {
        return 404;
    }

    # ส่งคำขอ API ไปยัง Go Backend (จำกัดเฉพาะ /api และ /api/... เท่านั้น)
    location ~ ^/api(/|$) {
        proxy_pass $cc25_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ส่งคำขอหน้าเว็บทั้งหมดไปยัง Astro + Nginx Frontend
    location / {
        proxy_pass $cc25_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

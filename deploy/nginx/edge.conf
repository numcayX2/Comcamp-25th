map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 10m;

    # หากเซิร์ฟเวอร์ภาควิชามี Reverse Proxy ชั้นหน้า (เช่น Host Nginx / Traefik / NPM / Cloudflare Tunnel)
    # ให้คลายคอมเมนต์ set_real_ip_from ของวง IP ที่เชื่อถือได้ด้านล่าง เพื่อให้ edge-proxy แกะ IP จริงของลูกค้า:
    # set_real_ip_from 127.0.0.1/32;
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 192.168.0.0/16;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # ปิดกั้น Swagger และ OpenAPI Docs ที่ระดับ Edge Proxy (Defense-in-Depth คู่กับ ENABLE_SWAGGER=false)
    location ~ ^/(swagger|docs|api/swagger|api/docs)(/|$) {
        return 404;
    }

    # ส่งคำขอ API ไปยัง Go Backend (จำกัดเฉพาะ /api และ /api/... เท่านั้น)
    location ~ ^/api(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ส่งคำขอหน้าเว็บทั้งหมดไปยัง Astro + Nginx Frontend
    location / {
        proxy_pass http://frontend:4321;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

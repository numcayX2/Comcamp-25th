# Production Nginx server config for ComCamp #25 static Astro build.
# Requires /etc/nginx/snippets/security-headers.conf (frontend/nginx/snippets/security-headers.conf).
# Note: If PUBLIC_API_URL or PUBLIC_GALLERY_BASE_URL uses an external origin, add it to
# connect-src / img-src in snippets/security-headers.conf before deploying.

server {
    listen 4321;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Sensitive application/staff routes: never persist HTML responses in browser or intermediary caches.
    location ~ ^/(admin|status|register)(\.html|/index\.html|/)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # /applicants lists minors' names: keep it out of search indexes. add_header in a location drops
    # inherited headers, so the security snippet is re-included.
    location ~ ^/applicants(\.html|/index\.html|/)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Content-hashed Astro assets: immutable long-lived caching while preserving nosniff & security headers.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html $uri/ =404;
    }
}

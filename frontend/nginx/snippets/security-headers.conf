# ComCamp #25 shared HTTP security response headers.
# Included in server scope AND re-included inside every child location block that calls add_header
# so Nginx never drops parent-level security headers when setting Cache-Control.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://comcamp25-gallery.sokulshop5.workers.dev; connect-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; form-action 'self';" always;

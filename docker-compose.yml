services:
  db:
    image: postgres:16-alpine
    container_name: comcamp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-comcamp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_strong_password}
      POSTGRES_DB: ${DB_NAME:-comcamp_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-comcamp} -d ${DB_NAME:-comcamp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:

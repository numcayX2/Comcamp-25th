services:
  db:
    image: postgres:16-alpine
    container_name: comcamp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-comcamp}
      # No fallback password (AGENTS.md §13.2): compose refuses to start until .env sets it.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-comcamp_db}
    ports:
      # Loopback only (AGENTS.md §13.1) - never publish the database on 0.0.0.0.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:16-alpine keeps its data in /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-comcamp} -d ${DB_NAME:-comcamp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:

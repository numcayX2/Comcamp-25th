services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-comcamp25}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.prod}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./backend/migrations:/migrations:ro
      - ./deploy/postgres-init/01-run-up-migrations.sh:/docker-entrypoint-initdb.d/01-run-up-migrations.sh:ro
    networks:
      - db_internal_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: comcamp25-backend:prod
    container_name: ${COMPOSE_PROJECT_NAME:-comcamp25}_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - uploads_data:/var/lib/cc25/uploads
    environment:
      APP_ENV: production
      ENABLE_SWAGGER: "false"
      PORT: "8000"
      TZ: Asia/Bangkok
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Set DB_USER in .env.prod}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.prod}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env.prod}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/24}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in .env.prod}
      UPLOAD_DIR: /var/lib/cc25/uploads
    networks:
      - db_internal_net
      - app_egress_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:?Set PUBLIC_TURNSTILE_SITE_KEY in .env.prod}
        PUBLIC_GALLERY_BASE_URL: ${PUBLIC_GALLERY_BASE_URL:-https://comcamp25-gallery.sokulshop5.workers.dev/}
    image: comcamp25-frontend:prod
    container_name: ${COMPOSE_PROJECT_NAME:-comcamp25}_frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/run:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks:
      - app_egress_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  edge-proxy:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-comcamp25}_edge
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${EDGE_BIND_IP:-127.0.0.1}:${EDGE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/run:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks:
      - app_egress_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  db_internal_net:
    driver: bridge
    internal: true
  app_egress_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_NET_SUBNET:-172.28.0.0/24}

volumes:
  pgdata_prod:
  uploads_data:
